name: Monthly TLC Pipeline

on:
  workflow_dispatch:

  schedule:
    # 12:00 UTC on the 15th of every month
    - cron: "0 12 15 * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: nyc-tlc-analytics-500621
      GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.dbt/gcp-key.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-cloud-bigquery \
            google-cloud-storage \
            google-auth \
            pyarrow \
            requests \
            dbt-bigquery==1.8.0

      - name: Configure GCP credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p "$HOME/.dbt"
          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" > "$HOME/.dbt/gcp-key.json"

      - name: Run ingestion
        working-directory: ingestion
        run: python ingest.py

      - name: Run dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .